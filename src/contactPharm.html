title: "Pharmacy WHMIS Training - Contact | WHMIS Wise"

<div class="page-container">
  <div class="contact-wrapper">

    <div class="contact-header">
      <h1 class="gradient-text">Get in Touch</h1>
      <p>Have a question about our WHMIS training? Need to purchase a bulk package for your clinic? Fill out the form
        and our team will get back to you shortly.</p>
    </div>

    <div class="contact-card">
      <form action="https://formsubmit.co/" method="POST">
        <input type="text" name="_honey" style="display:none">
        <input type="hidden" name="_subject" value="New Inquiry - WHMIS Wise Website">

        <input type="hidden" name="_next" value="https://whmiswise.com/thanks">

        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="john@dentalclinic.com" required>
        </div>

        <div class="input-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="4" placeholder="How can we help you today?" required></textarea>
        </div>

        <div class="button-row" style="margin-top: 30px; margin-bottom: 0;">
          <div class="button-wrap">
            <button class="glass-button" type="submit">
              <span>Send Message</span>
            </button>
            <div class="button-shadow"></div>
          </div>
        </div>
      </form>
    </div>

  </div>
</div>

<style>
  body {
    margin: 0;
    padding: 0;
    font-weight: 400;
  }

  /* ==========================================================
     🌟 PAGE LAYOUT (No background color) 🌟
     ========================================================== */
  .page-container {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 100px 5% 60px 5%;
    /* Gave desktop a little more top clearance too just in case */
    box-sizing: border-box;
    min-height: 100dvh;
    /* Use dynamic viewport height for better mobile support */
  }

  /* 🌟 SPLIT LAYOUT (Side by Side) 🌟 */
  .contact-wrapper {
    width: 100%;
    max-width: 1000px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
    animation: fadeUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    opacity: 0;
    transform: translateY(40px);
  }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ==========================================================
     🌟 HEADER SECTION (Left Side) 🌟
     ========================================================== */
  .contact-header {
    text-align: left;
    flex: 1;
  }

  .gradient-text {
    font-size: 3.5rem;
    font-weight: 800 !important;
    background: linear-gradient(90deg, #0968e5, #091970);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0 0 15px 0;
    line-height: 1.1;
  }

  .contact-header p {
    font-size: 1.15rem;
    line-height: 1.6;
    color: #555;
    margin: 0;
  }

  /* ==========================================================
     🌟 CONTACT CARD & FORM (Right Side) 🌟
     ========================================================== */
  .contact-card {
    background: #ffffff;
    flex: 1.2;
    width: 100%;
    padding: 40px 50px;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    box-sizing: border-box;
  }

  .input-group {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
  }

  .input-group label {

    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 8px;
    margin-left: 5px;
  }

  .input-group input,

    width: 100%;

    font-family: inherit;
    color: #333;

    border-radius: 12px;

    border-color: #0968e5;
    box-shadow: 0 0 0 4px rgba(9, 104, 229, 0.1);
  }

  /* ==========================================================
     🌟 GLASS BUTTON CSS 🌟
     ========================================================== */
  @property --angle-1 {
    syntax: "<angle>";
    inherits: false;
    initial-value: -75deg;
  }

  @property --angle-2 {
    syntax: "<angle>";
    inherits: false;
    initial-value: -45deg;
  }

  :root {
    --global--size: clamp(2rem, 4vw, 5rem);
    --anim--hover-time: 400ms;
    --anim--hover-ease: cubic-bezier(0.25, 1, 0.5, 1);
  }

  .button-wrap {
    position: relative;
    z-index: 2;
    border-radius: 999vw;
    background: transparent;
    pointer-events: none;
    transition: all var(--anim--hover-time) var(--anim--hover-ease);
    width: 100%;
  }

  .button-shadow {
    --shadow-cuttoff-fix: 2em;
    position: absolute;
    width: calc(100% + var(--shadow-cuttoff-fix));
    height: calc(100% + var(--shadow-cuttoff-fix));
    top: calc(0% - var(--shadow-cuttoff-fix) / 2);
    left: calc(0% - var(--shadow-cuttoff-fix) / 2);
    filter: blur(clamp(2px, 0.125em, 12px));

  }

  .button-shadow::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 999vw;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.1));

    height: calc(100% - var(--shadow-cuttoff-fix) - 0.25em);
    top: calc(var(--shadow-cuttoff-fix) - 0.5em);
    left: calc(var(--shadow-cuttoff-fix) - 0.875em);
    padding: 0.125em;
    box-sizing: border-box;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
  }

  .glass-button {
    --border-width: clamp(1px, 0.0625em, 4px);
    all: unset;
    cursor: pointer;
    position: relative;
    z-index: 3;
    pointer-events: auto;
    border-radius: 999vw;
    background: linear-gradient(-75deg, rgba(1, 213, 255, 0.05), rgba(1, 213, 255, 0.2), rgba(1, 213, 255, 0.05));
    box-shadow:

      inset 0 -0.125em 0.125em rgba(255, 255, 255, 0.5),
      0 0.25em 0.125em -0.125em rgba(0, 0, 0, 0.2),
      0 0 0.1em 0.25em inset rgba(255, 255, 255, 0.2),
      0 0 0 0 rgba(255, 255, 255, 1);
    backdrop-filter: blur(clamp(1px, 0.125em, 4px));
    transition: all var(--anim--hover-time) var(--anim--hover-ease);
    width: 100%;
    text-align: center;
    font-size: 20px;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    box-sizing: border-box;
  }

  .glass-button:hover {
    transform: scale(0.975);
    backdrop-filter: blur(0.01em);
    box-shadow:
      inset 0 0.125em 0.125em rgba(0, 0, 0, 0.05),
      inset 0 -0.125em 0.125em rgba(255, 255, 255, 0.5),
      0 0.15em 0.05em -0.1em rgba(0, 0, 0, 0.25),
      0 0 0.05em 0.1em inset rgba(255, 255, 255, 0.5),
      0 0 0 0 rgba(255, 255, 255, 1);
  }

  .glass-button span {
    display: block;
    position: relative;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #323232;
    text-shadow: 0em 0.25em 0.05em rgba(0, 0, 0, 0.1);
    padding: 0.75em 1.5em;
  }

  .glass-button span::after {
    content: "";
    position: absolute;
    z-index: 1;
    width: calc(100% - var(--border-width));
    height: calc(100% - var(--border-width));
    top: calc(var(--border-width) / 2);
    left: calc(var(--border-width) / 2);
    border-radius: 999vw;
    background: linear-gradient(var(--angle-2), rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.5) 40% 50%, rgba(255, 255, 255, 0) 55%);

    background-position: 0% 50%;
    mix-blend-mode: screen;
    pointer-events: none;
    transition: background-position calc(var(--anim--hover-time) * 1.25) var(--anim--hover-ease), --angle-2 calc(var(--anim--hover-time) * 1.25) var(--anim--hover-ease);
  }

  .glass-button:hover span::after {
    background-position: 25% 50%;
  }

  .glass-button:active span::after {
    background-position: 50% 15%;
    --angle-2: -15deg;
  }

  .glass-button::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 999vw;
    width: calc(100% + var(--border-width));
    height: calc(100% + var(--border-width));
    top: calc(0% - var(--border-width) / 2);
    left: calc(0% - var(--border-width) / 2);
    padding: var(--border-width);
    background: conic-gradient(from var(--angle-1) at 50% 50%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 5% 40%, rgba(0, 0, 0, 0.5) 50%, rgba(0, 0, 0, 0) 60% 95%, rgba(0, 0, 0, 0.5)), linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5));
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    transition: all var(--anim--hover-time) var(--anim--hover-ease), --angle-1 500ms ease;
    box-shadow: inset 0 0 0 calc(var(--border-width) / 2) rgba(255, 255, 255, 0.5);
  }

  .glass-button:hover::after {
    --angle-1: -125deg;
  }

  .glass-button:active::after {
    --angle-1: -75deg;
  }

  .button-row {
    display: flex;
    justify-content: center;
    width: 100%;
  }

  /* ==========================================================
     🌟 MOBILE OVERRIDES (Stacks vertically on small screens) 🌟
     ========================================================== */

    }

      flex-direction: column;
      gap: 40px;
    }

    .contact-header {
      text-align: center;
    }

    .contact-card {

    }

</style>
