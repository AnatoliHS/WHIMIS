---
layout: landing.njk
---

<div class="landing-viewport">
  
  <div class="hero-logo">
    <img src="/assets/WW.png" alt="Company Logo" class="site-logo">
  </div>

  <div class="hero-text">
    <h1 class="gradient-text">
      Work Smart. Stay Safe. Be WHMIS Wise
    </h1>
  </div>

  <div class="cards-row">
    
    <div class="card-col">
      <h2 class="top-label" style="animation-delay: 0.8s;">Foundational</h2>
      <div class="card bounce-card" style="animation-delay: 0.8s;" data-url="/homeReg/">
        <div class="card-bg" style="background-image: url('/assets/workSafety.jpg');"></div>
        
        <div class="border"></div>
        <div class="content">
          <div class="logo">
            <div class="logo-group">
              <div class="logo1">
                <img src="/assets/WW.png" alt="WW Logo">
              </div>
              <div class="logo2">
                <span style="color: #5096db;">Whmis</span><span style="color: #ac2226;">Wise</span>
              </div>
            </div>
            <span class="trail"></span>
          </div>
          <span class="logo-bottom-text">Foundational</span>
        </div>
        <span class="bottom-text">WHMIS Course</span>
      </div>
    </div>

    <div class="card-col">
      <h2 class="top-label" style="animation-delay: 1.0s;">Pharmacy</h2>
      <div class="card bounce-card" style="animation-delay: 1.0s;" data-url="/homePharm/">
        <div class="card-bg" style="background-image: url('/assets/pharmacy8.png');"></div>

        <div class="border"></div>
        <div class="content">
          <div class="logo">
            <div class="logo-group">
              <div class="logo1">
                <img src="/assets/whmiswisePharmacy.png" alt="Pharmacy Logo">
              </div>
              <div class="logo2">
                <span style="color: #5096db;">Whmis</span><span style="color: #ac2226;">Wise</span>
              </div>
            </div>
            <span class="trail"></span>
          </div>
          <span class="logo-bottom-text">Pharmaceutical</span>
        </div>
        <span class="bottom-text">WHMIS Course</span>
      </div>
    </div>

    <div class="card-col">
      <h2 class="top-label" style="animation-delay: 1.2s;">Dental</h2>
      <div class="card bounce-card" style="animation-delay: 1.2s;" data-url="/homeDent/">
        <div class="card-bg" style="background-image: url('/assets/dental9.jpg');"></div>

        <div class="border"></div>
        <div class="content">
          <div class="logo">
            <div class="logo-group">
              <div class="logo1">
                <img src="/assets/whmiswiseDental.png" alt="Dental Logo">
              </div>
              <div class="logo2">
                <span style="color: #5096db;">Whmis</span><span style="color: #ac2226;">Wise</span>
              </div>
            </div>
            <span class="trail"></span>
          </div>
          <span class="logo-bottom-text">Dental</span>
        </div>
        <span class="bottom-text">WHMIS Course</span>
      </div>
    </div>

  </div>
</div>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: inherit;
  }

  /* ==========================================================
     🌟 1. FULL PAGE CONTAINER 🌟
     ========================================================== */
  .landing-viewport {
    width: 100vw;
    min-height: 100dvh; 
    display: flex;
    flex-direction: column;
    align-items: center; 
    padding: 20px 20px 40px 20px; 
    box-sizing: border-box;
    overflow-x: hidden;
  }

  /* ==========================================================
     🌟 2. TOP: Logo 🌟
     ========================================================== */
  .hero-logo {
    margin-top: 0px;
    z-index: 5;
    text-align: center;
  }

  .site-logo {
    max-width: 280px; 
    height: auto;
    opacity: 0;
    animation: logoReveal 1.2s ease-out forwards 0.2s; 
  }

  @keyframes logoReveal {
    0% { opacity: 0; transform: translateY(30px); clip-path: inset(100% 0 0 0); }
    60% { opacity: 1; transform: translateY(0); clip-path: inset(0 0 0 0); }
    100% { opacity: 1; transform: none; clip-path: inset(0 0 0 0); }
  }

  /* ==========================================================
     🌟 3. MIDDLE: Text 🌟
     ========================================================== */
  .hero-text {
    margin-top: 15px; 
    /* 🌟 Added extra margin to separate the text from the top labels 🌟 */
    margin-bottom: 50px; 
    z-index: 5;
    text-align: center;
    opacity: 0;
    transform: translateY(-20px);
    animation: fadeDown 1s ease-out forwards 0.5s;
  }

  .gradient-text { 
    font-size: clamp(2rem, 4vw, 3.8rem); 
    font-weight: 400 !important;
    background: linear-gradient(90deg, #0968e5, #091970);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-fill-color: transparent;
    margin: 0;
    line-height: 1.2;
    white-space: nowrap; 
  }

  @keyframes fadeDown {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ==========================================================
     🌟 4. BOTTOM: CARDS ROW & COLUMNS 🌟
     ========================================================== */
  .cards-row {
    display: flex;
    flex-direction: row; 
    gap: 40px; 
    z-index: 10;
    margin-top: auto; 
    margin-bottom: 40px; 
  }

  .card-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px; 
  }

  .top-label {
    color: #ac2226;
    font-weight: 400;
    font-size: 1.6rem;
    margin: 0;
    letter-spacing: 1px;
    opacity: 0;
    animation: springUp 0.8s cubic-bezier(0.25, 1.25, 0.5, 1) forwards;
  }

  .bounce-card {
    cursor: pointer;
    opacity: 0;
    animation: springUp 0.8s cubic-bezier(0.25, 1.25, 0.5, 1) forwards;
  }

  @keyframes springUp {
    0% { opacity: 0; transform: translateY(80px) scale(0.9); }
    60% { opacity: 1; transform: translateY(-10px) scale(1.05); }
    80% { transform: translateY(5px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ==========================================================
     🌟 5. FROSTED GLASS CARDS CSS 🌟
     ========================================================== */
  .card {
    width: 380px;  
    height: 250px; 
    background: rgba(255, 255, 255, 0.15); 
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.4); 
    position: relative;
    display: grid;
    place-content: center;
    border-radius: 16px; 
    overflow: hidden;
    transition: all 0.6s ease-in-out;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
  }

  .card-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    z-index: 0; 
    transition: opacity 0.6s ease-in-out;
  }
  
  .card-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.4); 
  }

  .border {
    position: absolute; 
    inset: 0px; 
    border: 2px solid #ac2226; 
    opacity: 0; 
    transform: rotate(10deg); 
    transition: all 0.6s ease-in-out;
    border-radius: 14px; 
    z-index: 1;
  }

  .bottom-text {
    position: absolute; left: 50%; bottom: 15px; transform: translateX(-50%);
    font-size: 11px; 
    font-weight: 700;
    text-transform: uppercase; padding: 2px 10px; 
    color: #5096db; 
    background: rgba(255, 255, 255, 0.9); 
    border-radius: 4px;
    opacity: 0; letter-spacing: 7px;
    transition: all 0.6s ease-in-out;
    white-space: nowrap;
    z-index: 3;
  }

  .content { 
    position: absolute;
    inset: 0;
    z-index: 2; 
  }

  .content .logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    height: 110px; 
    width: 110px; 
    overflow: hidden; 
    transition: all 0.6s ease-in-out;
  }

  .content .logo-group {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0px; 
    transition: all 0.6s ease-in-out;
  }

  .content .logo .logo1 { 
    width: 110px; 
    height: 110px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
    transition: all 0.6s ease-in-out; 
  }
  
  .content .logo .logo1 img {
    height: 100%;
    width: 100%;
    object-fit: contain;
  }

  .content .logo .logo2 { 
    font-size: 32px; 
    font-weight: 800;
    white-space: nowrap;
    opacity: 0;
    max-width: 0px; 
    overflow: hidden;
    transition: all 0.6s ease-in-out;
  } 

  .content .logo .trail {
    position: absolute; 
    right: 0; 
    top: 50%;
    transform: translateY(-50%);
    height: 50px; 
    width: 100%; 
    opacity: 0;
    border-right: 2px solid transparent; 
  }

  .content .logo-bottom-text {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    margin-top: 70px; 
    color: #5096db; 
    font-weight: 700;
    font-size: 16px; 
    opacity: 0; 
    transition: all 0.6s ease-in-out 0.1s; 
    white-space: nowrap;
  }

  /* ==========================================================
     🌟 HOVER ANIMATIONS (DESKTOP AND ACTIVE MOBILE) 🌟
     ========================================================== */
  .card:hover, .card.animating { 
    border-radius: 4px; 
    transform: scale(1.05); 
    box-shadow: 0 25px 50px rgba(0,0,0,0.2); 
    background: rgba(255, 255, 255, 0.25); 
  }

  .card:hover .card-bg, .card.animating .card-bg { opacity: 0; }
  .card:hover .logo, .card.animating .logo { width: 340px; }
  .card:hover .logo-group, .card.animating .logo-group { gap: 15px; }
  .card:hover .logo .logo1, .card.animating .logo .logo1 { width: 60px; height: 60px; }
  .card:hover .logo .logo2, .card.animating .logo .logo2 { max-width: 250px; opacity: 1; }
  .card:hover .border, .card.animating .border { inset: 15px; opacity: 1; transform: rotate(0); }
  .card:hover .bottom-text, .card.animating .bottom-text { letter-spacing: 3px; opacity: 1; transform: translateX(-50%); }
  .card:hover .content .logo-bottom-text, .card.animating .content .logo-bottom-text { opacity: 1; letter-spacing: 9.5px; }
  .card:hover .trail, .card.animating .trail { animation: trail 0.6s ease-in-out, cardOpacity 0.6s ease-in-out; }

  @keyframes cardOpacity {
    0% { border-right: 2px solid transparent; }
    10% { border-right: 2px solid #ac2226; } 
    80% { border-right: 2px solid #ac2226; }
    100% { border-right: 2px solid transparent; }
  }

  @keyframes trail {
    0% { background: linear-gradient(90deg, rgba(172, 34, 38, 0) 90%, #ac2226 100%); opacity: 0; }
    30% { background: linear-gradient(90deg, rgba(172, 34, 38, 0) 70%, #ac2226 100%); opacity: 1; }
    70% { background: linear-gradient(90deg, rgba(172, 34, 38, 0) 70%, #ac2226 100%); opacity: 1; }
    95% { background: linear-gradient(90deg, rgba(172, 34, 38, 0) 90%, #ac2226 100%); opacity: 0; }
  }

  /* ==========================================================
     🌟 6. RESPONSIVE DESIGN 🌟
     ========================================================== */
  @media (max-width: 1300px) {
    .cards-row { gap: 20px; transform: scale(0.85); transform-origin: bottom center; }
  }

  @media (max-width: 1100px) {
    .cards-row { transform: scale(0.75); }
  }

  @media (max-width: 768px) {
    .landing-viewport {
      padding-top: 60px; 
      height: auto;
    }
    
    .hero-logo { margin-top: 20px; } 
    .hero-text { margin-top: 20px; }

    .gradient-text { 
      white-space: normal; 
      font-size: 2.5rem; 
    }

    .cards-row {
      transform: scale(1); 
      flex-direction: column; 
      align-items: center;
      gap: 30px;
      margin-top: 50px; 
    }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
      card.addEventListener('click', function(e) {
        e.preventDefault(); 
        
        const targetUrl = this.getAttribute('data-url');
        const isTouchDevice = window.matchMedia("(hover: none)").matches;

        if (isTouchDevice) {
          // Add the animation class on tap
          this.classList.add('animating');
          
          // Wait roughly the length of the CSS transition (650ms), then redirect
          setTimeout(() => {
            if (targetUrl) window.location.href = targetUrl;
          }, 1050); 
        } else {
          // On desktop, redirect instantly
          if (targetUrl) window.location.href = targetUrl;
        }
      });
    });
  });
</script>
